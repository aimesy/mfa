<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https://raw.githubusercontent.com https://api.github.com; img-src 'self' data: blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>California Impact Fee Collections</title>
    <meta name="description" content="Every published figure in the mfa-data release, with the page it was read from, its outline and its caveats." />
    <meta name="theme-color" content="#24211d" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="vendor/noto-emoji/noto-emoji.css" />
    <link rel="stylesheet" href="styles.css?v=20261001-1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aimesy/themes@828896459264d2eeea6dea4e1a4c3def0336b90d/src/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aimesy/themes@828896459264d2eeea6dea4e1a4c3def0336b90d/src/theme-bar.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aimesy/themes@828896459264d2eeea6dea4e1a4c3def0336b90d/src/bug-report.css" />
    <script src="https://cdn.jsdelivr.net/gh/aimesy/themes@828896459264d2eeea6dea4e1a4c3def0336b90d/src/theme.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/aimesy/themes@828896459264d2eeea6dea4e1a4c3def0336b90d/src/bug-report.js" defer></script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="hdr">
        <div class="status-strip amyc-theme-bar">
          <strong>MFA</strong>
          <span class="dot">.</span>
          <span>Impact fees</span>
          <span class="dot hide-narrow">.</span>
          <span class="hide-narrow">California</span>
          <span class="grow"></span>
          <a class="live" id="release-label" href="https://github.com/aimesy/mfa-data" target="_blank" rel="noopener">release</a>
          <button class="bug-report-trigger" type="button" data-bug-report data-bug-report-app="MFA" data-bug-report-repo="aimesy/mfa" data-bug-report-labels="bug,site-report" aria-label="Report a bug" title="Report a bug">
            <svg class="bug-report-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 8h8v8.5a4 4 0 0 1-8 0V8Z"></path>
              <path d="M9 8V6.8a3 3 0 0 1 6 0V8"></path>
              <path d="M12 8v12"></path>
              <path d="M4 13h4"></path>
              <path d="M16 13h4"></path>
              <path d="M5 19l3-2"></path>
              <path d="M19 19l-3-2"></path>
              <path d="M7 3l2 2"></path>
              <path d="M17 3l-2 2"></path>
            </svg>
          </button>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Theme spectrum" title="Theme spectrum">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a9 9 0 0 0 0 18h1.2a1.9 1.9 0 0 0 1.4-3.2 1.9 1.9 0 0 1 1.4-3.2h1.1A4.9 4.9 0 0 0 21 9.8C21 6 17 3 12 3Z"></path>
              <circle cx="7.7" cy="10.2" r="1"></circle>
              <circle cx="10.5" cy="6.9" r="1"></circle>
              <circle cx="14.7" cy="7.4" r="1"></circle>
              <circle cx="16.6" cy="11" r="1"></circle>
            </svg>
          </button>
        </div>
        <div class="entity-bar">
          <div class="hdr-left">
            <h1>California Impact Fee Collections</h1>
            <span id="stats" class="hdr-stats">opening the release</span>
          </div>
          <div class="hdr-right">
            <button class="hbtn" id="export-btn" type="button" title="Download this view (primary rows) as CSV" hidden>CSV</button>
            <a class="hbtn" id="repo-link" href="https://github.com/aimesy/mfa-data" target="_blank" rel="noopener">GitHub</a>
            <a class="hbtn" id="terms-link" href="https://github.com/aimesy/mfa-data/blob/main/DATA-USE-TERMS.md" target="_blank" rel="noopener">T&amp;Cs</a>
          </div>
        </div>
      </header>

      <nav class="view-strip" aria-label="Views">
        <div class="view-tabs">
          <a class="view-tab" data-view="figures" href="?view=figures">Figures</a>
          <a class="view-tab" data-view="entities" href="?view=entities">Jurisdictions</a>
          <a class="view-tab" data-view="sources" href="?view=sources">Sources</a>
          <a class="view-tab" data-view="about" href="?view=about">About</a>
        </div>
      </nav>

      <section class="toolbar" id="toolbar" hidden></section>

      <section class="banner" id="loading-banner" role="status" aria-live="polite" aria-busy="true">
        <div class="loading-card">
          <span class="loading-spinner" aria-hidden="true"></span>
          <div class="loading-copy">
            <div id="loading-msg">Opening the release</div>
            <div id="loading-detail">Finding the release.</div>
          </div>
          <button class="btn loading-retry" id="loading-retry" type="button" hidden>Retry</button>
        </div>
      </section>

      <div class="workspace" id="workspace" hidden>
        <main class="content" id="content" tabindex="-1"></main>
        <aside class="panel" id="panel" hidden aria-label="Evidence"></aside>
      </div>
    </div>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

    <script type="module" src="app.js?v=20261001-1"></script>
  </body>
</html>
