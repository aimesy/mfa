# The mfa-data Worker: serves the private aimesy/mfa-data release to the
# viewer at mfa.amyc.us (README "Data Worker"). Deployed by the release-worker
# job in .github/workflows/pages.yml; needs Wrangler 4.107.0 or later for the
# per-entrypoint cache settings below.

name = "mfa-data"
main = "index.js"
account_id = "06e69f381ac9e7c54620cb6fa5dc34d6"
# ctx.exports is on by default from 2025-11-17.
compatibility_date = "2026-10-01"

workers_dev = false
preview_urls = false
routes = [{ pattern = "mfa-data.amyc.us", custom_domain = true }]

# Workers Logs (free plan: 200,000 events a day, kept 3 days). The gateway
# logs each data request's kind and session state, never an address.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Pages allowed to read the release, matched against Origin, or else the
# origin of Referer. Separate with spaces.
ALLOWED_ORIGINS = "https://mfa.amyc.us https://aimesy.github.io"
# "true" refuses data requests that carry no session from the Turnstile check;
# anything else serves them and only reports the state in X-MFA-Session.
REQUIRE_SESSION = "true"
# The browser check and document limits (worker/gate.js, the same file in
# every data Worker; TURNSTILE-SPEC.md). Every number is here; gate.js has
# the same values as defaults. A "document" is what release.js documentKey()
# names; index files never count. Counts key on the browser ID cookie, the
# address only backs them up.
# Sessions and the browser ID cookie, in seconds.
SESSION_SECONDS = "43200"
TRUSTED_SESSION_SECONDS = "2592000"
BROWSER_ID_SECONDS = "34560000"
# Distinct documents each passed check allows; then a visible check gives
# the next batch.
DOCUMENTS_PER_CHECK = "100"
# Distinct documents per browser per UTC day, and in any WEEKLY_DAYS UTC days.
DAILY_DOCUMENT_LIMIT = "500"
WEEKLY_DOCUMENT_LIMIT = "1000"
WEEKLY_DAYS = "7"
# Distinct documents per address per UTC day, whatever the browser.
ADDRESS_DAILY_DOCUMENT_LIMIT = "2000"
# More than RECHECK_DOCUMENTS_PER_MINUTE distinct documents within
# RECHECK_WINDOW_SECONDS ends the session; the browser may start a new one,
# with a visible check, after RECHECK_PAUSE_SECONDS.
RECHECK_DOCUMENTS_PER_MINUTE = "50"
RECHECK_WINDOW_SECONDS = "60"
RECHECK_PAUSE_SECONDS = "600"
# More new sessions than this from one address in a clock hour get 429 on
# /session for the rest of the hour; VISIBLE_CHECK_AFTER_TRIPS too fast trips
# from one address within TRIP_WINDOW_SECONDS make its checks visible.
MAX_SESSIONS_PER_ADDRESS_PER_HOUR = "30"
VISIBLE_CHECK_AFTER_TRIPS = "3"
TRIP_WINDOW_SECONDS = "86400"
# An idle counter deletes itself after this many seconds.
BROWSER_RECORD_SECONDS = "691200"
ADDRESS_RECORD_SECONDS = "172800"
# Trusted keys: SHA-256 (hex) of each key, each followed by a short label (an
# initial, never a name or an email), separated by spaces. The same list is
# in all five data Workers. Make a key with scripts/new-trusted-key in
# aimesy/mfa; revoke one by deleting its hash and redeploying.
TRUSTED_KEY_HASHES = ""

# Requests a minute for each address: files (no byte range) and slices (one
# byte range of a big report). period must be 10 or 60; if it changes, change
# RETRY_AFTER_SECONDS in release.js to match.
[[ratelimits]]
name = "FILE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 50
  period = 60

[[ratelimits]]
name = "SLICE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 600
  period = 60

# The document counters (gate.js): one Durable Object for each browser ID
# and one for each address.
[[durable_objects.bindings]]
name = "DAILY_QUOTA"
class_name = "DailyQuota"

# Workers Caching sits in front of every entrypoint. The default entrypoint
# (origin check and rate limit) must stay uncached, or a cache hit would skip
# both; only Release, which fetches from GitHub, is cached.
[cache]
enabled = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.Release]
type = "worker"

  [exports.Release.cache]
  enabled = true

[exports.DailyQuota]
type = "durable-object"
storage = "sqlite"

# Secrets, set by the workflow and never written here: MFA_DATA_TOKEN (from
# the MFA_DATA_ACCESS Actions secret), TURNSTILE_SECRET_KEY (from the
# TURNSTILE_SECRET_KEY Actions secret) and SESSION_KEY (random on each deploy,
# which ends existing sessions; the viewer quietly starts a new one). The
# browser ID cookie must outlive deploys, so gate.js signs it with a key
# derived from TURNSTILE_SECRET_KEY (or a BROWSER_KEY secret, if one is set).
