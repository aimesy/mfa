# Active once this folder is the root of its own viewer repository (the
# kcsc / kcsc-data split). Inside aimesy/mfa-data it sits under site/ and
# GitHub ignores it. Enable Pages once in Settings -> Pages with
# "Source: GitHub Actions".

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check viewer and shared theme static contracts
        run: node check-static.mjs
      - name: Test the data model
        run: node tests/model.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
